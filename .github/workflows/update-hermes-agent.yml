name: Update Hermes Agent ebuild

on:
  schedule:
    - cron: '0 0 * * *' # Check daily
  workflow_dispatch: # Allow manual trigger

env:
  PACKAGE_DIR: app-ai/hermes-agent
  TESTENV_IMAGE: ghcr.io/faraclas/adaptive-overlay/testenv:latest

jobs:
  update-ebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch latest Hermes Agent release
        id: get_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          RELEASE_JSON=$(curl -sSfL \
            --oauth2-bearer "${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/NousResearch/hermes-agent/releases/latest)

          LATEST_TAG=$(echo "${RELEASE_JSON}" | jq -r '.tag_name')
          if [ "${LATEST_TAG}" = "null" ] || [ -z "${LATEST_TAG}" ]; then
            echo "::error::Failed to get latest release tag from upstream API"
            exit 1
          fi

          # Remove 'v' prefix for ebuild version
          VERSION="${LATEST_TAG#v}"
          echo "latest_version=${VERSION}" >> "$GITHUB_OUTPUT"

          # Find current ebuild version (highest non-live version)
          CURRENT_VERSION=$(find "${PACKAGE_DIR}" -maxdepth 1 -name 'hermes-agent-*.ebuild' \
            ! -name 'hermes-agent-9999.ebuild' -printf '%f\n' \
            | sed -n 's/^hermes-agent-\(.*\)\.ebuild$/\1/p' \
            | sort -V | tail -n 1)
          echo "current_version=${CURRENT_VERSION}" >> "$GITHUB_OUTPUT"

          echo "Latest upstream version : ${VERSION}"
          echo "Current ebuild version  : ${CURRENT_VERSION:-<none>}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Update ebuild if new version exists
        id: update
        if: steps.get_release.outputs.latest_version != steps.get_release.outputs.current_version
        env:
          LATEST_VER: ${{ steps.get_release.outputs.latest_version }}
          CURRENT_VER: ${{ steps.get_release.outputs.current_version }}
        run: |
          set -euo pipefail

          # Remove the superseded ebuild and its metadata cache entry
          if [ -n "${CURRENT_VER}" ]; then
            git rm --quiet "${PACKAGE_DIR}/hermes-agent-${CURRENT_VER}.ebuild"
            git rm --quiet --ignore-unmatch \
              "metadata/md5-cache/app-ai/hermes-agent-${CURRENT_VER}"
          fi

          # Create new ebuild from the live (9999) ebuild
          cp "${PACKAGE_DIR}/hermes-agent-9999.ebuild" \
            "${PACKAGE_DIR}/hermes-agent-${LATEST_VER}.ebuild"

          # Generate the Manifest inside the Gentoo test environment.
          #
          # The workspace is mounted at /mnt/adaptive-overlay and symlinked to
          # the location the image's repos.conf expects. Do NOT `chown -R` the
          # mounted workspace: that also rewrites ownership of .git, which makes
          # the repository unwritable for the runner user and breaks every later
          # git-based step (create-pull-request fails with
          # "could not lock config file .git/config: Permission denied").
          # Instead only the generated files are handed back to the runner user.
          docker run --rm \
            --user root \
            -v "${GITHUB_WORKSPACE}:/mnt/adaptive-overlay:rw" \
            -e "PACKAGE_DIR=${PACKAGE_DIR}" \
            -e "HOST_UID=$(id -u)" \
            -e "HOST_GID=$(id -g)" \
            "${TESTENV_IMAGE}" \
            bash -c '
              set -euo pipefail

              rm -rf /var/db/repos/adaptive-overlay
              ln -s /mnt/adaptive-overlay /var/db/repos/adaptive-overlay

              # pkgdev shells out to git; the checkout is owned by the runner
              # user, not root, so mark it explicitly as safe.
              git config --global --add safe.directory /mnt/adaptive-overlay

              cd "/var/db/repos/adaptive-overlay/${PACKAGE_DIR}"
              echo "==> pkgdev manifest"
              pkgdev manifest

              # Hand every file the container touched back to the runner user,
              # while leaving .git untouched so the checkout stays writable.
              find /mnt/adaptive-overlay -path /mnt/adaptive-overlay/.git -prune \
                -o -exec chown "${HOST_UID}:${HOST_GID}" {} +
            '

          # Fail loudly and early if the container left the checkout unusable.
          if [ ! -w .git/config ]; then
            echo "::error::.git/config is not writable after the manifest step"
            ls -ld .git .git/config
            exit 1
          fi

          if [ -z "$(git status --porcelain)" ]; then
            echo "::error::No changes were produced for version ${LATEST_VER}"
            exit 1
          fi

          git status --short

      - name: Create Pull Request
        if: steps.get_release.outputs.latest_version != steps.get_release.outputs.current_version
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "bump(app-ai/hermes-agent): update to ${{ steps.get_release.outputs.latest_version }}"
          title: "Update hermes-agent to ${{ steps.get_release.outputs.latest_version }}"
          body: "Automated update for hermes-agent from upstream releases."
          branch: "update-hermes-agent-${{ steps.get_release.outputs.latest_version }}"
